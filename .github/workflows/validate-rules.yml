name: Validate Rules

on:
  push:
    branches: [main]
    paths:
      - '.rulesync/**'
      - 'rulesync.jsonc'
      - 'bin/validate-rules.js'
  pull_request:
    branches: [main]
    paths:
      - '.rulesync/**'
      - 'rulesync.jsonc'
      - 'bin/validate-rules.js'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate rule files
        run: npm run validate:rules

      - name: Generate rules (verify rules compile)
        run: npm run build
