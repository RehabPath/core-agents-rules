name: Notify Slack on Rule Changes

on:
  push:
    branches: [main]
    paths:
      - '.rulesync/rules/**'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed rules
        id: changes
        run: |
          # Get list of added/modified rule files
          ADDED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '.rulesync/rules/*.md' | xargs -I {} basename {} .md | tr '\n' ', ' | sed 's/,$//')
          MODIFIED=$(git diff --name-only --diff-filter=M HEAD~1 HEAD -- '.rulesync/rules/*.md' | xargs -I {} basename {} .md | tr '\n' ', ' | sed 's/,$//')
          DELETED=$(git diff --name-only --diff-filter=D HEAD~1 HEAD -- '.rulesync/rules/*.md' | xargs -I {} basename {} .md | tr '\n' ', ' | sed 's/,$//')
          
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "modified=$MODIFIED" >> $GITHUB_OUTPUT
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT
          
          # Check if any changes
          if [[ -n "$ADDED" || -n "$MODIFIED" || -n "$DELETED" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Slack message
        id: message
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          MESSAGE="*LLM Rules Updated* :robot_face:\n\n"
          
          if [[ -n "${{ steps.changes.outputs.added }}" ]]; then
            MESSAGE="${MESSAGE}:sparkles: *New rules:* ${{ steps.changes.outputs.added }}\n"
          fi
          
          if [[ -n "${{ steps.changes.outputs.modified }}" ]]; then
            MESSAGE="${MESSAGE}:pencil2: *Modified:* ${{ steps.changes.outputs.modified }}\n"
          fi
          
          if [[ -n "${{ steps.changes.outputs.deleted }}" ]]; then
            MESSAGE="${MESSAGE}:wastebasket: *Removed:* ${{ steps.changes.outputs.deleted }}\n"
          fi
          
          MESSAGE="${MESSAGE}\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|View commit>"
          
          # Escape for JSON
          MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')
          echo "text=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"${{ steps.message.outputs.text }}\"}" \
            "$SLACK_WEBHOOK_URL"
