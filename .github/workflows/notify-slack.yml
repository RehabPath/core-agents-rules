name: Notify Slack on Rule Changes

on:
  push:
    branches:
      - main
    paths:
      - 'tessl/**'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed tiles
        id: changes
        run: |
          ADDED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'tessl/**' | grep '^tessl/' | sed 's|tessl/||;s|/.*||' | sort -u | tr '\n' ', ' | sed 's/,$//')
          MODIFIED=$(git diff --name-only --diff-filter=M HEAD~1 HEAD -- 'tessl/**' | grep '^tessl/' | sed 's|tessl/||;s|/.*||' | sort -u | tr '\n' ', ' | sed 's/,$//')
          DELETED=$(git diff --name-only --diff-filter=D HEAD~1 HEAD -- 'tessl/**' | grep '^tessl/' | sed 's|tessl/||;s|/.*||' | sort -u | tr '\n' ', ' | sed 's/,$//')

          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "modified=$MODIFIED" >> $GITHUB_OUTPUT
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: steps.changes.outputs.added != '' || steps.changes.outputs.modified != '' || steps.changes.outputs.deleted != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="*LLM Rules Updated*\n\n"

          if [ -n "${{ steps.changes.outputs.added }}" ]; then
            MESSAGE="${MESSAGE}New tiles: ${{ steps.changes.outputs.added }}\n"
          fi

          if [ -n "${{ steps.changes.outputs.modified }}" ]; then
            MESSAGE="${MESSAGE}Modified: ${{ steps.changes.outputs.modified }}\n"
          fi

          if [ -n "${{ steps.changes.outputs.deleted }}" ]; then
            MESSAGE="${MESSAGE}Removed: ${{ steps.changes.outputs.deleted }}\n"
          fi

          MESSAGE="${MESSAGE}\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|View commit>"

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$MESSAGE\"}" \
            "$SLACK_WEBHOOK_URL"
